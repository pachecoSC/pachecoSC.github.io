<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha Técnica de la Planta</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-main: #2c3e50;
            --text-muted: #7f8c8d;
            --accent-green: #27ae60;
            --accent-red: #c0392b;
            --border-color: #e2e8f0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background: var(--card-bg);
            width: 100%;
            max-width: 450px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .card-header {
            background: linear-gradient(135deg, #1883ff 0%, #2a5298 100%);
            color: white;
            padding: 24px;
            text-align: center;
        }

        .card-header h1 {
            margin: 0;
            font-size: 1.5rem;
            letter-spacing: 0.5px;
        }

        .badge-id {
            display: inline-block;
            background: rgba(255, 255, 255, 0.2);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 2rem;
            margin-top: 10px;
            font-weight: bold;
            width: 10rem;
            height: 2.5rem;
        }

        .card-body {
            padding: 24px;
        }

        .info-group {
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
        }

        .info-group:last-child {
            margin-bottom: 0;
            border-bottom: none;
            padding-bottom: 0;
        }

        .label {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
            display: block;
        }

        .value {
            font-size: 1.1rem;
            font-weight: 500;
            word-wrap: break-word;
        }

        /* Estado de Infección Dinámico */
        .status-box {
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            font-size: 1.1rem;
            margin-top: 10px;
        }

        .status-safe {
            background-color: #e8f5e9;
            color: var(--accent-green);
            border: 1px solid #c8e6c9;
        }

        .status-infected {
            background-color: #ffebee;
            color: var(--accent-red);
            border: 1px solid #ffcdd2;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="card-header">
            <h1>Tecnical Data Sheet</h1>
            <span class="badge-id" id="plant-id">S/N</span>
        </div>

        <div class="card-body">

            <div class="info-group">
                <span class="label">Mycorrhizae Consortium</span>
                <div class="value" id="plant-consorcio">❌</div>
            </div>
            <div class="info-group">
                <span class="label">Pre-infection Height(cm) </span>
                <div class="value" id="plant-altura">No especificada</div>
            </div>
            <div class="info-group">
                <span class="label">Pre-infection Functional Leaves(cm)</span>
                <div class="value" id="plant-hojas">No especificada</div>
            </div>
            <div class="info-group">
                <span class="label">Location</span>
                <div class="value" id="plant-ubicacion">Mesa</div>
            </div>
            <div class="info-group">
                <span class="label">Link For More Details</span>
                <div class="value" id="plant-descripcion">Sin descripción disponible.</div>
            </div>
            <div class="info-group">
                <span class="label">Phytosanitary Status</span>
                <div id="plant-estado" class="status-box">Cargando estado...</div>
            </div>
        </div>
    </div>

    <script>
        // 1. Leer parámetros de la URL
        const params = new URLSearchParams(window.location.search);

        const id = params.get('id');
        const descripcion = params.get('desc');
        const consorcio = params.get('cons');
        const altura = params.get('alt');
        const hojas = params.get('hojas');
        const ubicacion = params.get('ubi');
        const infectada = params.get('infect'); // Espera "si" o "no"

        // 2. Inyectar datos en el HTML si existen
        if (id) document.getElementById('plant-id').textContent = `${id}`;
        if (consorcio) document.getElementById('plant-consorcio').textContent = consorcio;
        // if (descripcion) document.getElementById('plant-descripcion').textContent = descripcion;
        if (altura) document.getElementById('plant-altura').textContent = altura;
        //3. Lógica del enlace a drive
        if (descripcion) {
          descripcionElement.innerHTML = `
            <a href="${descripcion}" target="_blank" rel="noopener noreferrer">
              More details...
            </a>
          `;
        } else {
          descripcionElement.textContent = "not available.";
        }
        
        // 4. Lógica del estado de infección
        const estadoElemento = document.getElementById('plant-estado');

        if (infectada && infectada.toLowerCase() === 'si') {
            estadoElemento.textContent = "⚠️ INFECTED";
            estadoElemento.className = "status-box status-infected";
        } else if (infectada && infectada.toLowerCase() === 'no') {
            estadoElemento.textContent = "✅ HEALTHY / FUSARIUM FREE";
            estadoElemento.className = "status-box status-safe";
        } else {
            estadoElemento.textContent = "No determinado";
            estadoElemento.style.backgroundColor = "#f1f3f5";
            estadoElemento.style.color = "#6c757d";
        }
    </script>
</body>
</html>
