!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Template Dinámico</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background-color: #f4f4f9; }
        .card { background: white; padding: 30px; border-radius: 10px; display: inline-block; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h1 { color: #333; }
        p { color: #666; font-size: 1.2em; }
    </style>
</head>
<body>

    <div class="card">
        <!-- Los elementos con ID serán modificados por JavaScript -->
        <h1 id="saludo">¡Hola, Invitado!</h1>
        <p id="mensaje">Bienvenido a mi sitio web template.</p>
    </div>

    <script>
        // 1. Capturar los parámetros de la URL (?nombre=Valor&rol=Valor)
        const params = new URLSearchParams(window.location.search);
        
        // 2. Obtener los valores específicos
        const nombreUsuario = params.get('nombre');
        const rolUsuario = params.get('rol');

        // 3. Pintar los valores en el HTML si existen en la URL
        if (nombreUsuario) {
            document.getElementById('saludo').textContent = `¡Hola, ${nombreUsuario}!`;
        }
        
        if (rolUsuario) {
            document.getElementById('mensaje').textContent = `Tu rol actual es: ${rolUsuario}.`;
        }
    </script>
</body>
</html>
